<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Finansowy Tinder: Fakt czy Pułapka?</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            display: ['"Archivo Black"', 'sans-serif'],
            body: ['"Space Grotesk"', 'sans-serif'],
          },
          colors: {
            yellow: '#FDE047',
            lilac: '#C4B5FD',
            ink: '#111111',
            paper: '#FFFFFF',
          },
        },
      },
    };
  </script>
  <style>
    body {
      font-family: "Space Grotesk", sans-serif;
      background: #FDE047;
      color: #111111;
      min-height: 100vh;
    }
    .font-display { font-family: "Archivo Black", sans-serif; }
    .brutal { border: 4px solid #111111; box-shadow: 6px 6px 0 #111111; }
    .choice-card { transition: transform 0.2s ease; }
    .choice-card:hover { transform: translateY(-4px); }
  </style>
</head>
<body>
  <main class="min-h-screen flex flex-col items-center justify-center px-5 py-10">
    <div class="w-full max-w-lg text-center mb-10">
      <p class="font-bold uppercase tracking-widest text-sm mb-3">OFFLINE STUDIO CHALLENGE</p>
      <h1 class="font-display text-4xl sm:text-5xl leading-none uppercase mb-3">
        Finansowy Tinder:<br />Fakt czy Pułapka?
      </h1>
      <p class="font-medium text-ink/70 max-w-md mx-auto">
        Multiplayer na żywo: prowadzący na dużym ekranie, gracze na telefonach.
      </p>
    </div>

    <div class="w-full max-w-lg grid gap-4 sm:grid-cols-2">
      <a href="./play.html" class="choice-card brutal block bg-paper p-6 text-left">
        <span class="inline-block text-xs font-bold uppercase tracking-wider mb-2">Gracz</span>
        <h2 class="font-display text-2xl uppercase mb-1">Dołącz do gry</h2>
        <p class="text-sm text-ink/60">Wpisz PIN pokoju i nick – graj na telefonie.</p>
      </a>
      <a href="./host.html" class="choice-card brutal block bg-lilac p-6 text-left">
        <span class="inline-block text-xs font-bold uppercase tracking-wider mb-2">Prowadzący</span>
        <h2 class="font-display text-2xl uppercase mb-1">Ekran hosta</h2>
        <p class="text-sm text-ink/70">Utwórz pokój, pokaż PIN i ranking na żywo.</p>
      </a>
    </div>
  </main>
</body>
</html>
